
name: Deploy Website to Bluehost

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -eu

          test -n "$SSH_PRIVATE_KEY" || { echo "BLUEHOST_SSH_KEY is empty"; exit 1; }
          test -n "$SSH_HOST" || { echo "SSH_HOST is empty"; exit 1; }
          test -n "$SSH_PORT" || { echo "SSH_PORT is empty"; exit 1; }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Test Bluehost SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -eu

          test -n "$SSH_USERNAME" || { echo "SSH_USERNAME is empty"; exit 1; }

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USERNAME@$SSH_HOST" \
            "echo SSH_CONNECTION_SUCCESS"

      - name: Deploy website with rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu

          test -n "$DEPLOY_PATH" || { echo "DEPLOY_PATH is empty"; exit 1; }

          rsync -avz \
            --exclude='.git/' \
            --exclude='.github/' \
            -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key -p $SSH_PORT" \
            ./ "$SSH_USERNAME@$SSH_HOST:$DEPLOY_PATH"
