
name: Deploy Creative Nerds to Bluehost

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.BLUEHOST_SSH_KEY_B64 }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -eu

          test -n "$SSH_PRIVATE_KEY_B64" || {
            echo "ERROR: BLUEHOST_SSH_KEY_B64 secret is missing"
            exit 1
          }

          test -n "$SSH_HOST" || {
            echo "ERROR: SSH_HOST secret is missing"
            exit 1
          }

          test -n "$SSH_PORT" || {
            echo "ERROR: SSH_PORT secret is missing"
            exit 1
          }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s' "$SSH_PRIVATE_KEY_B64" \
            | base64 --decode > "$HOME/.ssh/deploy_key"

          chmod 600 "$HOME/.ssh/deploy_key"

          echo "Validating private key format..."

          ssh-keygen -y -f "$HOME/.ssh/deploy_key" \
            > /dev/null

          echo "Private key format is valid."

          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" \
            >> "$HOME/.ssh/known_hosts" 2>/dev/null

          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Test Bluehost SSH Connection
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -eu

          test -n "$SSH_USERNAME" || {
            echo "ERROR: SSH_USERNAME secret is missing"
            exit 1
          }

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SSH_PORT" \
            "$SSH_USERNAME@$SSH_HOST" \
            "echo SSH_CONNECTION_SUCCESS"

      - name: Validate Deployment Path
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu

          test -n "$DEPLOY_PATH" || {
            echo "ERROR: DEPLOY_PATH secret is missing"
            exit 1
          }

          case "$DEPLOY_PATH" in
            /*) ;;
            *)
              echo "ERROR: DEPLOY_PATH must be an absolute path"
              exit 1
              ;;
          esac

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SSH_PORT" \
            "$SSH_USERNAME@$SSH_HOST" \
            "test -d '$DEPLOY_PATH' && echo DEPLOY_PATH_EXISTS"

      - name: Deploy Website Using rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu

          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -i $HOME/.ssh/deploy_key -p $SSH_PORT" \
            ./ "$SSH_USERNAME@$SSH_HOST:$DEPLOY_PATH"

          echo "Website deployment completed successfully."

      - name: Cleanup SSH Key
        if: always()
        run: |
          rm -f "$HOME/.ssh/deploy_key"
