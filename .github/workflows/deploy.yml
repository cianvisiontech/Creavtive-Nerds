
name: Deploy Creative Nerds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          KEY_B64: ${{ secrets.BLUEHOST_SSH_KEY_B64 }}
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          USERNAME: ${{ secrets.SSH_USERNAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu

          test -n "$KEY_B64" || {
            echo "Missing repository secret: BLUEHOST_SSH_KEY_B64"
            exit 1
          }

          test -n "$HOST" || { echo "Missing SSH_HOST"; exit 1; }
          test -n "$PORT" || { echo "Missing SSH_PORT"; exit 1; }
          test -n "$USERNAME" || { echo "Missing SSH_USERNAME"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "Missing DEPLOY_PATH"; exit 1; }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s' "$KEY_B64" | base64 --decode > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null

          ssh-keyscan -p "$PORT" "$HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Test SSH
        env:
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          set -eu

          ssh -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/deploy_key" \
            -p "$PORT" "$USERNAME@$HOST" \
            "echo SSH_CONNECTION_SUCCESS"

      - name: Deploy
        env:
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT }}
          USERNAME: ${{ secrets.SSH_USERNAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu

          case "$DEPLOY_PATH" in
            /*) ;;
            *) echo "DEPLOY_PATH must be an absolute server path"; exit 1 ;;
          esac

          ssh -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/deploy_key" \
            -p "$PORT" "$USERNAME@$HOST" \
            "test -d '$DEPLOY_PATH'"

          rsync -avz \
            --exclude='.git/' \
            --exclude='.github/' \
            -e "ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -i $HOME/.ssh/deploy_key -p $PORT" \
            ./ "$USERNAME@$HOST:$DEPLOY_PATH"

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
